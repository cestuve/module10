<body>
<a class="sr-only" href="#mainContent">Skip to course content</a>
<div class="app" id="app">
<header class="hud hidden" id="courseHud" aria-label="Course menu"><button class="menu-toggle" id="menuToggle" type="button" aria-expanded="false">Menu ▾</button><div class="menu hidden" id="sceneMenu" aria-hidden="true"></div></header>
<main id="mainContent"></main>
<div class="modal-backdrop hidden" id="modalBackdrop" role="dialog" aria-modal="true" aria-hidden="true"><div class="modal" id="modalPanel"><button class="close-btn" id="closeModal" aria-label="Close dialog">×</button><div id="modalContent"></div></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div><div class="sr-only" id="srStatus" aria-live="polite"></div>
</div>
<script>(() => {
'use strict';
const MODULE9='https://cestuve.github.io/module9/';
const MODULE10='https://cestuve.github.io/module10/';
const IMG={
 exterior:'https://cestuve.github.io/module1/BG-01.png',
 finalExterior:'https://cestuve.github.io/module1/BG-08.png',
 office:'https://cestuve.github.io/module2/Maria_Office.png',
 training:MODULE9+'Staff_Training_Room.png',
 consultation:MODULE9+'Client_Consultation_Room.png',
 meeting:MODULE9+'Community_Meeting_Room.png',
 assessmentRoom:'https://cestuve.github.io/module6/Assessment_Resource_Room.png',
 mariaFull:MODULE10+'Maria_Fullbody.png', mariaHead:MODULE10+'Maria_Headshot.png',
 danielFull:MODULE10+'Daniel_Fullbody.png', danielHead:MODULE10+'Daniel_Headshot.png',
 derekFull:MODULE10+'Derek_Fullbody.png', derekHead:MODULE10+'Derek_Headshot.png', derekFollow:MODULE10+'Derek_Followup.png',
 monicaFull:MODULE10+'Monica_Fullbody.png', monicaHead:MODULE10+'Monica_Headshot.png',
 peerFull:MODULE10+'Peer_Specialist_Fullbody.png', peerHead:MODULE10+'Peer_Specialist_Headshot.png',
 brain:MODULE10+'Brain_Reward_Pathway.png', brainAdapt:MODULE10+'Brain_Adaptation.png', iceberg:MODULE10+'Behavior_Iceberg.png',
 naloxone:MODULE10+'Naloxone_Kit.png', harmToolkit:MODULE10+'Harm_Reduction_Toolkit.png'
};
const sections=[
 ['Welcome','A new week at Harbor Point'],
 ['Understanding Addiction','Connect theories to Derek’s story'],
 ['Brain & Reward','Reward, adaptation, craving, and recovery'],
 ['Recurrence & Planning','Triggers, motivation, access, and ROSC'],
 ['Recovery Pathways','Compare models and combine supports'],
 ['Harm Reduction','Reduce risk while supporting positive change'],
 ['Trauma-Informed Care','Safety, choice, trust, and healing'],
 ['Motivation & Family','MI, ambivalence, and family recovery'],
 ['CBT & Craving','Thoughts, behavior, functional analysis, and coping'],
 ['Integration & Complete','Build an individualized recovery plan']
];
const storageKey='harborPointModule10_v1';
const defaultState={reflections:{wholePerson:'',pathway:'',autonomy:'',support:''},completed:Array(10).fill(false),currentSection:-1,theories:new Set(),models:new Set()};
const state=defaultState;
let recurrenceTabsSeen=new Set();
let motivationTabsSeen=new Set();
try{const saved=JSON.parse(localStorage.getItem(storageKey)||'{}');if(saved.reflections)state.reflections={...state.reflections,...saved.reflections};if(Array.isArray(saved.completed))state.completed=state.completed.map((_,i)=>Boolean(saved.completed[i]));if(Number.isInteger(saved.currentSection))state.currentSection=saved.currentSection;}catch(e){}
const main=document.getElementById('mainContent'),hud=document.getElementById('courseHud'),menu=document.getElementById('sceneMenu'),menuToggle=document.getElementById('menuToggle'),modalBackdrop=document.getElementById('modalBackdrop'),modalContent=document.getElementById('modalContent'),closeModalBtn=document.getElementById('closeModal'),toast=document.getElementById('toast'),srStatus=document.getElementById('srStatus');
function save(){try{localStorage.setItem(storageKey,JSON.stringify({reflections:state.reflections,completed:state.completed,currentSection:state.currentSection}))}catch(e){}}
function esc(v){return String(v??'').replace(/[&<>'"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]))}
function say(t){srStatus.textContent='';setTimeout(()=>srStatus.textContent=t,20)}
function showToast(t){toast.textContent=t;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),2200)}
function showModal(html){modalContent.innerHTML=html;modalBackdrop.classList.remove('hidden');modalBackdrop.setAttribute('aria-hidden','false');const p=document.getElementById('modalPanel');if(p)p.scrollTop=0;setTimeout(()=>closeModalBtn.focus(),20)}
function closeModal(){modalBackdrop.classList.add('hidden');modalBackdrop.setAttribute('aria-hidden','true')}
closeModalBtn.addEventListener('click',closeModal);modalBackdrop.addEventListener('click',e=>{if(e.target===modalBackdrop)closeModal()});window.addEventListener('keydown',e=>{if(e.key==='Escape'&&!modalBackdrop.classList.contains('hidden'))closeModal()});
function setCurrentSection(i){if(!Number.isInteger(i)||i<0||i>=sections.length)return;state.currentSection=i;renderMenu();save()}
function renderMenu(){const done=state.completed.filter(Boolean).length;menu.innerHTML=`<div class="menu-progress" role="status">${done} of ${sections.length} sections complete</div>`+sections.map((s,i)=>{const complete=Boolean(state.completed[i]);return `<button class="menu-item ${complete?'completed':''}" type="button" data-jump="${i}" ${i===state.currentSection?'aria-current="page"':''} aria-label="${esc(`${i+1}. ${s[0]}. ${s[1]}.${complete?' Completed.':''}`)}">${i+1}. ${s[0]}<span>${s[1]}</span>${complete?'<span class="menu-check" aria-hidden="true">✓</span>':''}</button>`}).join('')}
function markSection(i){if(i<0||i>=state.completed.length)return;if(!state.completed[i]){state.completed[i]=true;save();renderMenu()}}
menuToggle.addEventListener('click',e=>{e.stopPropagation();menu.classList.toggle('hidden');const hidden=menu.classList.contains('hidden');menuToggle.setAttribute('aria-expanded',hidden?'false':'true');menu.setAttribute('aria-hidden',hidden?'true':'false')});document.addEventListener('click',e=>{if(!e.target.closest('#courseHud')){menu.classList.add('hidden');menuToggle.setAttribute('aria-expanded','false');menu.setAttribute('aria-hidden','true')}});
function headQuote(img,name,copy){return `<div class="quote-card quote-with-headshot"><img src="${img}" alt="${esc(name)}"><div><strong>${esc(name)}</strong><p>${copy}</p></div></div>`}
function choiceMarkup(action,opts){return `<div class="question-block"><div class="choices">${opts.map((o,i)=>`<button class="choice-btn" type="button" data-action="${action}" data-v="${i}"><span class="choice-title">${String.fromCharCode(65+i)}.</span><span class="choice-text">${o}</span></button>`).join('')}</div><div class="inline-question-feedback" aria-live="polite"></div></div>`}
function markChoice(button,correctIndex){const v=Number(button.dataset.v),ok=v===correctIndex;if(ok){[...button.parentElement.querySelectorAll('.choice-btn')].forEach((x,j)=>{x.disabled=true;if(j===correctIndex)x.classList.add('correct')})}else button.classList.add('incorrect');return ok}
function feedback(button,ok,title,body,nextAction,nextLabel){const block=button.closest('.question-block');const box=block?block.querySelector('.inline-question-feedback'):null;if(!box)return;box.className='inline-question-feedback has-feedback '+(ok?'correct':'incorrect');box.innerHTML=`<strong>${title}</strong>${body}${ok&&nextAction?`<div class="button-row"><button class="primary-btn" type="button" data-action="${nextAction}">${nextLabel}</button></div>`:''}`;say(`${title}. ${box.textContent||''}`)}
function titleIntro(){main.innerHTML=`<section class="intro-scene"><div class="intro-panel"><span class="mini-label">Harbor Point · Module 10</span><h1>From Addiction to Recovery</h1><div class="intro-rule"></div><p class="intro-lead">Last week, you explored different ways to understand addiction and learned that readiness for change can look different from one person to another.</p><p class="intro-copy">This week, you will follow Derek’s story further. The Harbor Point team will help you connect addiction science with recovery models and evidence-based counseling approaches, including harm reduction, trauma-informed care, motivational interviewing, family approaches, cognitive-behavioral therapy, and strategies for coping with craving.</p><p class="intro-copy">The goal is not to find one perfect theory or treatment. It is to learn how multiple approaches can be combined to support a whole person over time.</p><div class="button-row"><button class="primary-btn" data-action="go-exterior">Return to Harbor Point →</button></div></div></section>`}
function exterior(){setCurrentSection(0);hud.classList.remove('hidden');main.innerHTML=`<section class="scene"><div class="environment" style="background-image:url('${IMG.exterior}')"><div class="scene-title-card" style="top:110px;left:7%;text-align:left"><span class="mini-label">Module 10 · A New Week</span><h1>Harbor Point Recovery Services</h1><p>Maria asked you to join a case conference. Derek has returned, and the team is thinking about what recovery could look like for him over time.</p></div><button class="hotspot" type="button" aria-label="Enter Harbor Point" data-action="maria-scene" style="left:52%;top:34%;width:18%;height:36%"></button></div></section>`}
function mariaScene(){setCurrentSection(0);closeModal();main.innerHTML=`<section class="scene"><div class="environment" style="background-image:url('${IMG.office}')"><div class="scene-guide">Check in with Maria before the case conference.</div><img class="character" src="${IMG.mariaFull}" alt="Maria" style="left:50%;transform:translateX(-50%);bottom:-2%;height:70vh"><button class="character-hotspot" data-action="maria-intro" type="button" aria-label="Talk with Maria" style="left:50%;transform:translateX(-50%);bottom:2%;width:30%;height:64%"></button></div></section>`}
function mariaIntro(){showModal(`<h2>From Understanding to Supporting Recovery</h2><div class="quote-card quote-with-headshot"><img class="headshot-lower" src="${IMG.mariaHead}" alt="Maria"><div><strong>Maria</strong><p>“Last week you practiced looking beyond a single explanation for addiction. Today we’re going to take the next step: What does that understanding mean for recovery?”</p></div></div><p>Derek has agreed to let the Harbor Point team discuss his care. Daniel will lead the conference, and you will meet two more people who may become part of Derek’s support system.</p><div class="teaching-card"><h3>What You’ll Practice</h3><div class="info-grid"><div class="info-card"><strong>Explain</strong><span>Explain how brain reward, learning, social context, and recovery processes can interact.</span></div><div class="info-card"><strong>Compare</strong><span>Compare major recovery models and identify the strengths and limits of each.</span></div><div class="info-card"><strong>Apply</strong><span>Apply recovery-oriented, harm-reduction, trauma-informed, motivational, family, and CBT concepts to client situations.</span></div><div class="info-card"><strong>Integrate</strong><span>Build an individualized plan that combines supports instead of forcing one pathway.</span></div></div></div><div class="button-row center"><button class="primary-btn" data-action="daniel-scene">Join the Case Conference →</button></div>`) }
function danielScene(){closeModal();main.innerHTML=`<section class="scene"><div class="environment" style="background-image:url('${IMG.assessmentRoom}')"><div class="scene-guide">Daniel is beginning the Harbor Point case conference.</div><img class="character" src="${IMG.danielFull}" alt="Daniel" style="left:50%;transform:translateX(-50%);bottom:-3%;height:70vh"><button class="character-hotspot" data-action="daniel-intro" type="button" aria-label="Talk with Daniel" style="left:50%;transform:translateX(-50%);bottom:2%;width:31%;height:64%"></button></div></section>`}
function danielIntro(){showModal(`<h2>The Question for Today</h2>${headQuote(IMG.danielHead,'Daniel','“Knowing why addiction may develop matters. But recovery decisions are where those ideas become practical.”')}<p>Derek’s story includes biological vulnerability, reinforcement and learned cues, beliefs about coping, stress, relationships, and environmental pressures. No single factor explains everything, and no single recovery model automatically addresses everything.</p><h3>Which approach is most consistent with a biopsychosocial understanding?</h3>${choiceMarkup('opening-choice',['Choose the one theory that best explains Derek and build the plan only from that theory.','Focus only on whether Derek can abstain, because recovery is defined by substance use alone.','Combine medical, psychological, behavioral, family, peer, and practical supports based on Derek’s goals and needs.','Avoid discussing theory because recovery is unrelated to how addiction develops.'])}`)}

function derekScene(){setCurrentSection(1);closeModal();main.innerHTML=`<section class="scene"><div class="environment" style="background-image:url('${IMG.consultation}')"><div class="scene-guide">Learn more about Derek’s story and review the factors that may be influencing his substance use.</div><img class="character" src="${IMG.derekFull}" alt="Derek" style="left:50%;transform:translateX(-50%);bottom:-3%;height:69vh"><button class="character-hotspot" data-action="derek-profile" type="button" aria-label="Review Derek's case" style="left:50%;transform:translateX(-50%);bottom:2%;width:29%;height:63%"></button></div></section>`}
function derekProfile(){showModal(`<h2>Derek: One Person, Many Influences</h2><div class="profile-card compact-profile"><img class="headshot-lower" src="${IMG.derekHead}" alt="Derek"><div><strong>Derek’s Story</strong><p>Derek has been working to address problematic alcohol use. He describes using alcohol for stress relief, strong habits linked to certain people and places, conflict at home, and periods when he has wanted change but felt unsure how to sustain it.</p></div></div><p>Daniel asks you to revisit the major theories from your notes, but this time with a recovery question in mind: <strong>What might each perspective tell us to pay attention to?</strong></p><div class="button-row center"><button class="primary-btn" data-action="theory-lab">Open the Theory Lab →</button></div>`) }
function theoryLab(){showModal(`<h2>Theory Lab: What Does Each Lens Notice?</h2><p>Review the perspectives below. Some theories overlap; their value is in the different questions they prompt us to ask.</p><div class="m10-model-grid">
${modelCard('Biological & Genetic','🧬','Genetic predisposition may affect metabolism, reward sensitivity, and vulnerability. Neurobiological theories focus on neurotransmitters and brain circuits involved in reward, motivation, memory, and decision-making.','bio')}
${modelCard('Disease Model','🩺','Views addiction as a chronic, relapsing disorder requiring treatment and ongoing management rather than moral judgment.','disease')}

function brainScene(){setCurrentSection(2);closeModal();main.innerHTML=`<section class="scene"><div class="environment" style="background-image:url('${IMG.assessmentRoom}')"><div class="scene-guide">Daniel shifts the case conference from theories to what repeated substance use can do to reward, motivation, and self-control.</div><img class="character" src="${IMG.danielFull}" alt="Daniel" style="left:50%;transform:translateX(-50%);bottom:-3%;height:70vh"><button class="character-hotspot" data-action="brain-open" type="button" aria-label="Explore the brain reward system" style="left:50%;transform:translateX(-50%);bottom:2%;width:31%;height:64%"></button></div></section>`}
function brainOpen(){showModal(`<h2>Inside the Reward and Motivation System</h2><div class="m10-split"><div><p>Dopamine is one part of the brain systems involved in motivation, learning, salience, and reinforcement. Addictive substances can produce unusually strong changes in reward signaling, increasing the likelihood that the behavior will be repeated.</p><ul><li><strong>Ventral tegmental area (VTA):</strong> a key source of dopamine neurons within reward circuitry.</li><li><strong>Nucleus accumbens:</strong> involved in reward, reinforcement, and motivation.</li><li><strong>Prefrontal cortex:</strong> supports judgment, planning, decision-making, and impulse control.</li></ul><p>Repeated substance exposure can alter reward, motivation, memory, and self-control systems. Environmental cues can also become strongly associated with substance use and trigger craving.</p></div><img class="m10-content-img" src="${IMG.brain}" alt="Illustration of brain reward and motivation pathway"></div><div class="button-row center"><button class="primary-btn" data-action="brain-adapt">What Changes Over Time? →</button></div>`)}
function brainAdapt(){showModal(`<h2>Adaptation, Tolerance, and Neuroplasticity</h2><img class="m10-wide-img" src="${IMG.brainAdapt}" alt="Three-stage illustration showing normal reward processing, adaptation after repeated exposure, and recovery through neuroplasticity"><div class="m10-three"><div class="m10-card"><span class="m10-icon" aria-hidden="true">⚡</span><strong>1. Reward & Reinforcement</strong><p>Substances can strongly activate reward pathways. The brain learns that the substance is important and worth repeating.</p></div><div class="m10-card"><span class="m10-icon" aria-hidden="true">🔄</span><strong>2. Adaptation</strong><p>With repeated exposure, the brain may become less responsive to the same amount of a substance or to ordinary rewards. Tolerance can develop, while craving and learned cue responses become powerful.</p></div><div class="m10-card"><span class="m10-icon" aria-hidden="true">🌱</span><strong>3. Recovery & Neuroplasticity</strong><p>The brain can change again. With time, treatment, supportive environments, and sustained recovery behaviors, brain function can improve or compensate through neuroplasticity.</p></div></div><div class="callout"><strong>Important:</strong> Understanding brain change does not erase personal agency. It helps explain why recovery often requires more than simply telling someone to “just stop.”</div><div class="button-row center"><button class="primary-btn" data-action="brain-behavior">Continue →</button></div>`) }
function brainBehavior(){showModal(`<h2>Look for Patterns, Not Labels</h2><p>A substance use disorder is not identified by one laboratory result, one behavior, or one “type” of person. Assessment focuses on <strong>patterns of substance use and how they affect a person’s functioning.</strong></p><p>The 11 substance use disorder criteria fall into four broad areas:</p><div class="m10-four"><div class="m10-card"><span class="m10-icon" aria-hidden="true">🎛️</span><strong>Impaired control</strong><p>Using more than intended, difficulty cutting down, spending substantial time related to substance use, or experiencing craving.</p></div><div class="m10-card"><span class="m10-icon" aria-hidden="true">🤝</span><strong>Social impairment</strong><p>Substance use interferes with responsibilities, relationships, or important social, work, or recreational activities.</p></div><div class="m10-card"><span class="m10-icon" aria-hidden="true">⚠️</span><strong>Risky use</strong><p>Substance use occurs in hazardous situations or continues despite known physical or psychological problems.</p></div><div class="m10-card"><span class="m10-icon" aria-hidden="true">🧪</span><strong>Pharmacological features</strong><p>Tolerance and withdrawal can be part of the pattern, but they are only two pieces of a broader clinical picture.</p></div></div><div class="callout"><strong>The key takeaway:</strong> These behaviors provide information for assessment. They are not evidence that someone is lazy, irresponsible, weak, or unwilling to change.</div><h3>Apply It</h3><p>A client says, “I really do want to stop, but the cravings get so strong that I give in. I have tried cutting back several times and cannot seem to stick with it.”</p><h3>What is the most appropriate interpretation?</h3>${choiceMarkup('brain-choice',['The client’s repeated return to use shows that recovery is not a priority.','The presence of craving is enough by itself to confirm a substance use disorder.','The client should first demonstrate stronger self-control before treatment can be effective.','Craving and difficulty cutting down are clinically relevant signs that should be explored as part of the assessment.'])}`)}

function recurrenceOpen(){recurrenceTabsSeen=new Set();showModal(`<h2>Recurrence Is Information, Not Erasure</h2><p><a class="resource-link" href="https://www.ncbi.nlm.nih.gov/books/NBK601482/" target="_blank" rel="noopener">SAMHSA's Treatment Improvement Protocol (TIP) 65</a> emphasizes looking for warning signs and revisiting the plan rather than treating a recurrence as if all prior progress disappeared.</p><div class="callout m10-instructions"><strong>Instructions:</strong> Although you are welcome to read SAMHSA’s TIP 65, you can review a summary of the document by selecting each of the four buttons below: Risk &amp; Triggers, Confidence &amp; Motivation, Update the Plan, and Access &amp; ROSC.</div><div class="m10-tabbar" data-track-tabs="recurrence"><button class="m10-tab" data-tab="risk">Risk &amp; Triggers</button><button class="m10-tab" data-tab="confidence">Confidence &amp; Motivation</button><button class="m10-tab" data-tab="plan">Update the Plan</button><button class="m10-tab" data-tab="access">Access &amp; ROSC</button></div><p id="recurrenceProgress" class="small muted center">0 of 4 topics reviewed</p>
<div class="m10-tabpanel" data-panel="risk"><div class="m10-four"><div class="m10-card"><span class="m10-icon" aria-hidden="true">🚦</span><strong>Warning signs</strong><p>Tools such as the <a class="resource-link" href="https://www.ncbi.nlm.nih.gov/books/NBK601489/box/ch2.b10/?report=objectonly" target="_blank" rel="noopener">AWARE questionnaire</a> can help identify warning signs of recurrence. Results should be discussed neutrally and nonjudgmentally.</p></div><div class="m10-card"><span class="m10-icon" aria-hidden="true">📍</span><strong>High-risk situations</strong><p>Ask who, where, and when. Past experiences help identify situations where recurrence has been more likely.</p></div><div class="m10-card"><span class="m10-icon" aria-hidden="true">🔔</span><strong>External triggers</strong><p>People, places, smells, sounds, objects, time of day, and other environmental cues can become linked with use.</p></div><div class="m10-card"><span class="m10-icon" aria-hidden="true">💭</span><strong>Internal triggers</strong><p>Thoughts, emotions, physical cravings, stress, anger, loneliness, fatigue, and other internal states can increase risk.</p></div></div><div class="callout"><strong>HALT:</strong> Hungry, Angry, Lonely, Tired is a simple reminder to address needs early rather than wait until stress becomes overwhelming.</div></div>
<div class="m10-tabpanel" data-panel="confidence"><div class="m10-four"><div class="m10-card"><span class="m10-icon" aria-hidden="true">📊</span><strong>Confidence is situation-specific</strong><p>The <a class="resource-link" href="https://www.ncbi.nlm.nih.gov/books/NBK571063/bin/A2_p177.pdf" target="_blank" rel="noopener">Brief Situational Confidence Questionnaire</a> asks people to rate confidence in resisting heavy drinking or drug use across high-risk situations.</p></div><div class="m10-card"><span class="m10-icon" aria-hidden="true">🧭</span><strong>Motivation is fluid</strong><p>Motivation can change across time and situations. Counselors can explore recognition of a problem, ambivalence, taking steps, and commitment.</p></div><div class="m10-card"><span class="m10-icon" aria-hidden="true">📝</span><strong>Tools for readiness and commitment</strong><p>TIP 65 names <a class="resource-link" href="https://www.ncbi.nlm.nih.gov/books/NBK571063/bin/A2_p164.pdf" target="_blank" rel="noopener">SOCRATES</a>, the <a class="resource-link" href="https://nda.nih.gov/data-structure/cmt_sober01" target="_blank" rel="noopener">Commitment to Sobriety Scale</a> for clients pursuing abstinence, and the Addiction Treatment Attitudes Questionnaire (this is a copyrighted questionnaire, so it is unavailable for download).</p></div><div class="m10-card"><span class="m10-icon" aria-hidden="true">🌱</span><strong>Build on progress</strong><p>Explore the client’s reasons, goals, confidence, and barriers while reinforcing strengths, prior progress, and autonomy.</p></div></div><div class="m10-quote">A counselor’s job is not to manufacture motivation. It is to explore the client’s reasons, goals, confidence, and barriers while reinforcing progress and autonomy.</div></div>
<div class="m10-tabpanel" data-panel="plan"><div class="m10-four"><div class="m10-card"><span class="m10-icon" aria-hidden="true">🔎</span><strong>Reassess</strong><p>Review triggers, warning signs, coping skills, thoughts, urges, impulses, and motivation instead of treating recurrence as proof that the plan failed.</p></div><div class="m10-card"><span class="m10-icon" aria-hidden="true">🛠️</span><strong>Adjust supports</strong><p>Consider whether mutual-help participation, recreation, peer support, counseling intensity, or other services need to change.</p></div><div class="m10-card"><span class="m10-icon" aria-hidden="true">💪</span><strong>Rebuild confidence</strong><p>A recurrence can lower confidence. Remind clients of prior progress and help them identify what they learned.</p></div><div class="m10-card"><span class="m10-icon" aria-hidden="true">🎯</span><strong>Reconnect with goals</strong><p>Help the client recommit to goals that remain meaningful and revise goals when circumstances or priorities have changed.</p></div></div></div>
<div class="m10-tabpanel" data-panel="access"><div class="m10-four"><div class="m10-card"><span class="m10-icon" aria-hidden="true">💳</span><strong>Coverage &amp; payment</strong><p>TIP 65 identifies practical barriers, such as insurance coverage, “medical necessity” rules, reimbursement limits, fee schedules, prior authorization, and lack of insurance.</p></div><div class="m10-card"><span class="m10-icon" aria-hidden="true">🧱</span><strong>Service silos</strong><p>Separating substance use treatment from medical, psychiatric, and social services can make coordinated care harder to deliver.</p></div><div class="m10-card"><span class="m10-icon" aria-hidden="true">🔗</span><strong>Recovery-oriented systems of care (ROSC)</strong><p>Connects behavioral health, medical care, criminal justice, social services, housing, child care, peers, and other supports across the recovery continuum.</p></div><div class="m10-card"><span class="m10-icon" aria-hidden="true">🏗️</span><strong>Respond at the systems level</strong><p>Programs can pursue grant funding, collect outcome data, support coverage navigation, strengthen partnerships, and advocate for integrated care.</p></div></div></div>
<div class="button-row center hidden" id="recurrencePractice"><button class="primary-btn" data-action="trigger-check">Practice Identifying Triggers →</button></div>`) }

function peerOpen(){showModal(`<h2>Meet Avery, Peer Recovery Specialist</h2>${headQuote(IMG.peerHead,'Avery','“Recovery is not one road. People may draw from different approaches and combinations of treatment, medication, peer support, family support, spirituality, skill building, housing, work, and community.”')}<p>There are six recovery models. Review what each emphasizes, along with a strength and a limitation.</p><div class="recovery-table-wrap"><table class="recovery-table"><thead><tr><th scope="col">Recovery model</th><th scope="col">What it emphasizes</th><th scope="col">Strength</th><th scope="col">Limitation</th></tr></thead><tbody><tr><td class="model-name">🩺 Medical / Disease</td><td>Views addiction as a chronic, relapsing brain disease requiring ongoing management. Often emphasizes abstinence, recurrence prevention, medication treatment, structure, and professional oversight.</td><td>Evidence-based and can reduce moral stigma.</td><td>May underemphasize agency and social context.</td></tr><tr><td class="model-name">🤝 12-Step / Mutual Help</td><td>Emphasizes mutual aid, meetings, sponsorship, spiritual growth, acceptance, and a Higher Power broadly defined.</td><td>Accessible community and long-term peer engagement.</td><td>May not fit every belief system or preference.</td></tr><tr><td class="model-name">🧠 Psychological / Behavioral</td><td>Uses approaches such as CBT, motivational interviewing, and contingency management to change patterns, strengthen coping, and build self-efficacy.</td><td>Evidence-based and flexible.</td><td>May require access to trained providers and active participation.</td></tr><tr><td class="model-name">🌱 Recovery-Oriented / Strengths-Based</td><td>Emphasizes hope, empowerment, self-determination, individualized goals, housing, employment, relationships, and community connection.</td><td>Holistic, person-centered, and inclusive.</td><td>Can be less structured and depends on available supports.</td></tr><tr><td class="model-name">🛟 Harm Reduction</td><td>Focuses on reducing negative consequences and supporting positive change without requiring abstinence as a condition for care.</td><td>Pragmatic and inclusive across stages of change.</td><td>Can be misunderstood or criticized when people assume only abstinence counts as recovery.</td></tr><tr><td class="model-name">🧩 Integrated / Biopsychosocial</td><td>Combines medical, psychological, behavioral, peer, family, and social supports based on the person’s needs and goals.</td><td>Comprehensive and adaptable.</td><td>Can be resource-intensive and difficult to coordinate across systems.</td></tr></tbody></table></div><div class="m10-quote">Peer support can be part of many of these recovery approaches. Peer specialists use lived experience to model hope, help people navigate resources, strengthen recovery skills, and connect clients with community-based supports.</div><div class="callout"><strong>Key point:</strong> No single model fits everyone. Modern recovery care often combines approaches while preserving client autonomy and individual recovery goals.</div><div class="button-row center"><button class="primary-btn" data-action="medication-recovery">Continue →</button></div>`) }

function recoveryModels2(){showModal(`<h2>Recovery Models: More Pathways</h2><div class="m10-model-grid">${recoveryStaticCard('Recovery-Oriented / Strengths-Based','🌱','Emphasizes hope, empowerment, self-determination, individualized goals, housing, employment, relationships, and community connection.','Holistic, person-centered, and inclusive.','Can be less structured and depends on available supports.')}${recoveryStaticCard('Harm Reduction','🛟','Focuses on reducing negative consequences and supporting positive change without requiring abstinence as a condition for care.','Pragmatic and inclusive across stages of change.','Can be misunderstood or criticized when people assume only abstinence counts as recovery.')}${recoveryStaticCard('Integrated / Biopsychosocial','🧩','Combines medical, psychological, behavioral, peer, family, and social supports based on the person’s needs and goals.','Comprehensive and adaptable.','Can be resource-intensive and difficult to coordinate across systems.')}</div><div class="callout"><strong>Key point:</strong> No single model fits everyone. Modern recovery care often combines approaches while preserving client autonomy and individual recovery goals.</div><div class="button-row center"><button class="primary-btn" data-action="medication-recovery">Continue →</button></div>`) }
function medicationRecovery(){showModal(`<h2>Medication Can Be Part of Recovery</h2><div class="m10-split"><div><p>Medication is one evidence-based tool that may be combined with counseling and recovery support. Examples include <strong>methadone, buprenorphine, and naltrexone</strong> for opioid use disorder and <strong>naltrexone and acamprosate</strong> for alcohol use disorder.</p><p>Medication decisions belong to appropriately qualified prescribers. Within the CDCA role, the focus is education, support, referral, coordination, and reducing stigma about evidence-based treatment.</p><div class="callout"><strong>Think integration, not competition:</strong> Medication, behavioral counseling, peer support, family services, and practical supports can work together.</div></div><div class="m10-hero-icon" aria-hidden="true">💊</div></div><div class="button-row center"><button class="primary-btn" data-action="pathway-choice">Build Derek’s Plan →</button></div>`) }

function harmOpen(){showModal(`<h2>Harm Reduction: Safety Without Abandoning Recovery</h2><div class="m10-split"><div><p>TIP 65 describes harm reduction as an evidence-based, proactive approach that reduces negative health consequences while meeting people where they are and respecting their goals.</p><p>Core themes include autonomy, acceptance, engagement, low-barrier support, safety, listening, relationships, multiple pathways to well-being, and focusing on positive change as defined by the person.</p></div><img class="m10-content-img" src="${IMG.harmToolkit}" alt="Generic harm reduction toolkit with public health supplies"></div><h3>SAMHSA’s Harm Reduction Framework: Six Practice Areas</h3><div class="m10-three"><div class="m10-card"><span class="m10-icon" aria-hidden="true">🧰</span><strong>Safer practices</strong><p>Education and tools that reduce immediate risks</p></div><div class="m10-card"><span class="m10-icon" aria-hidden="true">🏠</span><strong>Safer settings</strong><p>Stigma-free, trauma-informed places for respite, support, and safer behavior</p></div><div class="m10-card"><span class="m10-icon" aria-hidden="true">🏥</span><strong>Safer access to healthcare</strong><p>Person-centered, nonstigmatizing, low-barrier care</p></div><div class="m10-card"><span class="m10-icon" aria-hidden="true">🔗</span><strong>Safer transitions to care</strong><p>Connections to treatment, telehealth, medication access, and care on demand</p></div><div class="m10-card"><span class="m10-icon" aria-hidden="true">👥</span><strong>Sustainable workforce</strong><p>Training, support, appropriate compensation, and resources for harm-reduction workers</p></div><div class="m10-card"><span class="m10-icon" aria-hidden="true">🏗️</span><strong>Sustainable infrastructure</strong><p>Community-led systems that can maintain effective harm-reduction services over time</p></div></div><div class="button-row center"><button class="primary-btn" data-action="harm-practice">See Harm Reduction in Practice →</button></div>`) }
function harmPractice(){showModal(`<h2>Harm Reduction in Practice</h2><div class="m10-split"><div><p>Harm reduction includes a range of practical strategies that support safety, health, and connection to care. The right combination depends on the person’s needs, circumstances, and goals.</p></div><img class="m10-content-img" src="${IMG.harmToolkit}" alt="Generic harm reduction toolkit with public health supplies"></div><div class="m10-three"><div class="m10-card"><span class="m10-icon" aria-hidden="true">🛟</span><strong>Overdose prevention</strong><p>Overdose education and naloxone distribution can save lives. Naloxone rapidly reverses opioid overdose effects and should be paired with connection to ongoing care.</p></div><div class="m10-card"><span class="m10-icon" aria-hidden="true">🧼</span><strong>Syringe services &amp; safer practices</strong><p>Access to sterile supplies, safe disposal, wound-care education, vaccination, infection screening, and treatment referrals can reduce infectious disease and connect people to care.</p></div><div class="m10-card"><span class="m10-icon" aria-hidden="true">🧪</span><strong>Drug checking</strong><p>Fentanyl and xylazine test strips can help identify unexpected substances. Naloxone should still be used in suspected opioid overdose even when xylazine may be present.</p></div><div class="m10-card"><span class="m10-icon" aria-hidden="true">❤️</span><strong>Sexual &amp; reproductive health</strong><p>HIV/STI prevention, testing, PrEP/PEP access, contraception, condoms, and comprehensive education are part of whole-person harm reduction.</p></div><div class="m10-card"><span class="m10-icon" aria-hidden="true">🛡️</span><strong>Protective behavioral strategies</strong><p>Client-selected strategies can reduce substance use or reduce consequences—for example, setting limits or avoiding behaviors linked with rapid or risky use.</p></div><div class="m10-card"><span class="m10-icon" aria-hidden="true">🎯</span><strong>Client-driven goals</strong><p>Goals may focus on reducing harm or improving quality of life rather than immediate abstinence. Counselors track progress collaboratively and remain supportive when progress is uneven.</p></div></div><div class="callout"><strong>Harm reduction also applies beyond opioid use.</strong> TIP 65 discusses responses to stimulant “overamping,” including recognizing concerning symptoms, supporting basic health needs, and connecting people with medical care when symptoms are urgent. Counselors provide education and referral within their scope of practice.</div><div class="button-row center"><button class="primary-btn" data-action="harm-application">Continue →</button></div>`) }
function harmApplication(){showModal(`<h2>Put Harm Reduction Into Practice</h2><div class="quote-card quote-with-headshot"><img class="headshot-lower" src="${IMG.derekHead}" alt="Derek"><div><p>Derek says, “I’m not promising I’ll never drink again.”</p></div></div><p>A recovery-oriented response does not require Derek to commit to abstinence before receiving support. Instead, the counselor can work with him on meaningful goals while continuing to explore treatment options.</p><h3>Which response best reflects a harm-reduction approach?</h3>${choiceMarkup('harm-choice',['“Then you are not ready to begin services.”','“We need to make abstinence your goal before we can develop a treatment plan.”','“Because your drinking affects your family, they should decide what your treatment goal should be.”','“We can work on your goals, identify ways to reduce risk, and continue exploring treatment options together.”'])}`)}

function traumaOpen(){showModal(`<h2>Trauma-Informed Care: Start With Context</h2><p>Trauma can be acute, chronic, complex, historical, racial, intergenerational, relationship-based, or connected to poverty, homelessness, food insecurity, criminal justice involvement, combat, or other experiences. Trauma and substance use can affect one another, but counselors should not assume every client has a trauma history.</p><div class="m10-four"><div class="m10-card"><span class="m10-icon" aria-hidden="true">🌍</span><strong>Realize</strong><p>Understand the widespread impact of trauma and recognize that recovery can take different paths.</p></div><div class="m10-card"><span class="m10-icon" aria-hidden="true">👀</span><strong>Recognize</strong><p>Notice possible signs and symptoms of trauma without assuming every behavior has the same cause.</p></div><div class="m10-card"><span class="m10-icon" aria-hidden="true">🤝</span><strong>Respond</strong><p>Integrate knowledge about trauma into interactions, services, policies, and treatment planning.</p></div><div class="m10-card"><span class="m10-icon" aria-hidden="true">🛡️</span><strong>Resist retraumatization</strong><p>Use supportive language, choice, transparency, and practices that reduce unnecessary distress.</p></div></div><div class="callout"><strong>Remember:</strong> Trauma is not defined only by the event. People can experience the same event differently, and context matters.</div><div class="button-row center"><button class="primary-btn" data-action="trauma-principles">Continue to the Six Principles →</button></div>`) }
function traumaPrinciples(){showModal(`<h2>Six Principles of Trauma-Informed Care</h2><div class="m10-principle-grid"><div class="m10-principle"><span class="m10-icon" aria-hidden="true">🛡️</span><strong>Safety</strong><span>Promote physical and psychological safety.</span></div><div class="m10-principle"><span class="m10-icon" aria-hidden="true">🔎</span><strong>Trustworthiness & Transparency</strong><span>Set clear expectations and use honest, understandable processes.</span></div><div class="m10-principle"><span class="m10-icon" aria-hidden="true">🤝</span><strong>Peer Support</strong><span>Lived experience can build hope, trust, and connection.</span></div><div class="m10-principle"><span class="m10-icon" aria-hidden="true">⚖️</span><strong>Collaboration & Mutuality</strong><span>Share power and make decisions with clients rather than for them.</span></div><div class="m10-principle"><span class="m10-icon" aria-hidden="true">🗣️</span><strong>Empowerment, Voice & Choice</strong><span>Build on strengths, resilience, autonomy, and client-defined priorities.</span></div><div class="m10-principle"><span class="m10-icon" aria-hidden="true">🌎</span><strong>Cultural, Historical & Gender Issues</strong><span>Respond to culture, identity, history, and systemic context.</span></div></div><div class="teaching-card"><h3>Trauma-Informed Screening and Assessment</h3><div class="m10-four"><div class="m10-card"><span class="m10-icon" aria-hidden="true">📋</span><strong>Explain the process</strong><p>Clarify what the client can expect and why information is being requested.</p></div><div class="m10-card"><span class="m10-icon" aria-hidden="true">🧘</span><strong>Create comfort</strong><p>Use a supportive tone, respect personal space, and match the client’s level of engagement.</p></div><div class="m10-card"><span class="m10-icon" aria-hidden="true">🔐</span><strong>Ask only what is needed</strong><p>Do not push for greater detail simply because the counselor wants the full story.</p></div><div class="m10-card"><span class="m10-icon" aria-hidden="true">💬</span><strong>Use supportive language</strong><p>Language should reduce shame, respect culture, and avoid defining a person by trauma.</p></div></div></div><div class="m10-quote"><strong>Language matters.</strong> Supportive, culturally responsive language can reduce the risk of retraumatization. Some clinicians also use the term <em>healing-centered care</em> to emphasize well-being, strengths, and community rather than defining a person by trauma.</div><div class="button-row center"><button class="primary-btn" data-action="trauma-approaches">Continue →</button></div>`) }
function traumaApproaches(){showModal(`<h2>Trauma-Informed Approaches and Supports</h2><p>TIP 65 describes several trauma-focused and trauma-informed therapies. A CDCA does not need to provide these specialized therapies to recognize them, support client engagement, and coordinate appropriate referrals within scope.</p><div class="m10-therapy-list"><div class="m10-therapy"><strong>🧠 EMDR</strong><span>Processes distressing experiences through a structured trauma therapy.</span></div><div class="m10-therapy"><strong>🖼️ Accelerated Resolution Therapy</strong><span>Uses imagery and rescripting techniques.</span></div><div class="m10-therapy"><strong>🌤️ Exposure Therapy</strong><span>Gradual, structured work with trauma memories and avoidance.</span></div><div class="m10-therapy"><strong>📖 Narrative Therapy</strong><span>Uses the client’s story and strengths to place trauma in life context.</span></div><div class="m10-therapy"><strong>🧩 Cognitive Processing Therapy</strong><span>Targets trauma-related beliefs about safety, trust, power, esteem, and intimacy.</span></div><div class="m10-therapy"><strong>🧘 DBT & Mindfulness</strong><span>Build emotion regulation, distress tolerance, awareness, and coping.</span></div><div class="m10-therapy"><strong>🛠️ STAIR & Stress Inoculation</strong><span>Build affect regulation, interpersonal skills, guided self-talk, and coping strategies.</span></div><div class="m10-therapy"><strong>🛟 Seeking Safety</strong><span>Integrates coping-focused support for trauma and substance use.</span></div><div class="m10-therapy"><strong>🌱 TARGET / TREM / Integrated Models</strong><span>Structured approaches can combine resilience, regulation, trauma recovery, and substance-use recovery skills.</span></div></div><div class="m10-four"><div class="m10-card"><span class="m10-icon" aria-hidden="true">🌱</span><strong>Promote resilience</strong><p>Offer hope, teach coping and problem-solving, identify triggers, and help clients strengthen a sense of control.</p></div><div class="m10-card"><span class="m10-icon" aria-hidden="true">❤️</span><strong>Protect the helper, too</strong><p>Secondary trauma can affect counselors. Monitor your own reactions, seek support, use supervision, and practice appropriate self-care.</p></div></div><div class="button-row center"><button class="primary-btn" data-action="trauma-practice">Apply It With Derek →</button></div>`) }

function motivationOpen(){motivationTabsSeen=new Set();showModal(`<h2>Motivation, Ambivalence, and Family Recovery</h2><div class="callout m10-instructions"><strong>Instructions:</strong> Select each of the three buttons below to learn more about motivational interviewing, family recovery, and family approaches.</div><div class="m10-tabbar" data-track-tabs="motivation"><button class="m10-tab" data-tab="mi">Motivational Interviewing</button><button class="m10-tab" data-tab="family">Family Recovery</button><button class="m10-tab" data-tab="familyapproaches">Family Approaches</button></div><p id="motivationProgress" class="small muted center">0 of 3 topics reviewed</p><div class="m10-tabpanel" data-panel="mi"><p>Motivational interviewing (MI) is a person-centered approach that helps clients explore mixed feelings about change and strengthen their own motivation to move forward. Rather than persuading clients or telling them what they should do, counselors work collaboratively and help clients identify their own reasons for change.</p><div class="m10-four"><div class="m10-card"><strong>Core MI Communication Skills: OARS</strong><p>Counselors can use OARS to encourage conversation and help clients explore their thoughts, feelings, and goals:</p><div class="acronym-list mi-detailed"><div class="mi-skill"><div class="acronym-line"><span class="acronym-letter">O</span><strong>pen questions</strong></div><p>Invite clients to share more than a yes-or-no response.</p></div><div class="mi-skill"><div class="acronym-line"><span class="acronym-letter">A</span><strong>ffirmations</strong></div><p>Recognize strengths, efforts, values, and progress.</p></div><div class="mi-skill"><div class="acronym-line"><span class="acronym-letter">R</span><strong>eflective listening</strong></div><p>Restate or reflect what the client is communicating to show understanding and encourage deeper exploration.</p></div><div class="mi-skill"><div class="acronym-line"><span class="acronym-letter">S</span><strong>ummaries</strong></div><p>Bring together important parts of the conversation and highlight themes or possible movement toward change.</p></div></div></div><div class="m10-card"><strong>Supporting Choice and Confidence: FRAMES</strong><p>FRAMES describes additional strategies that support motivation while respecting client autonomy:</p><div class="acronym-list mi-detailed"><div class="mi-skill"><div class="acronym-line"><span class="acronym-letter">F</span><strong>eedback</strong></div><p>Share relevant information about the client’s situation.</p></div><div class="mi-skill"><div class="acronym-line"><span class="acronym-letter">R</span><strong>esponsibility</strong></div><p>Reinforce that decisions about change belong to the client.</p></div><div class="mi-skill"><div class="acronym-line"><span class="acronym-letter">A</span><strong>dvice with permission</strong></div><p>Offer guidance after asking whether the client would like it.</p></div><div class="mi-skill"><div class="acronym-line"><span class="acronym-letter">M</span><strong>enu of options</strong></div><p>Provide choices rather than prescribing a single path.</p></div><div class="mi-skill"><div class="acronym-line"><span class="acronym-letter">E</span><strong>mpathy</strong></div><p>Communicate understanding without judgment.</p></div><div class="mi-skill"><div class="acronym-line"><span class="acronym-letter">S</span><strong>elf-efficacy</strong></div><p>Help clients recognize their ability to make meaningful change.</p></div></div></div><div class="m10-card"><strong>Listening for Change: DARN-CAT</strong><p>Counselors also listen for language that may signal increasing readiness for change:</p><h4>DARN</h4><div class="acronym-list mi-detailed"><div class="mi-skill"><div class="acronym-line"><span class="acronym-letter">D</span><strong>esire</strong></div><p>“I want to…”</p></div><div class="mi-skill"><div class="acronym-line"><span class="acronym-letter">A</span><strong>bility</strong></div><p>“I could…”</p></div><div class="mi-skill"><div class="acronym-line"><span class="acronym-letter">R</span><strong>easons</strong></div><p>“It would help because…”</p></div><div class="mi-skill"><div class="acronym-line"><span class="acronym-letter">N</span><strong>eed</strong></div><p>“I need to…”</p></div></div></div><div class="m10-card"><strong>CAT</strong><p>Listen for language that reflects movement from considering change toward action:</p><div class="acronym-list mi-detailed"><div class="mi-skill"><div class="acronym-line"><span class="acronym-letter">C</span><strong>ommitment</strong></div><p>“I will…”</p></div><div class="mi-skill"><div class="acronym-line"><span class="acronym-letter">A</span><strong>ctivation</strong></div><p>“I am ready to…”</p></div><div class="mi-skill"><div class="acronym-line"><span class="acronym-letter">T</span><strong>aking steps</strong></div><p>“I already started…”</p></div></div></div></div><h3>Exploring Ambivalence</h3><p>Ambivalence—having reasons both to change and not to change—is a normal part of the change process. A <strong>decisional balance</strong> can help clients explore the perceived benefits and drawbacks of both continuing the current behavior and making a change without the counselor arguing for either side.</p><h3>Connecting MI to the Stages of Change</h3><p>MI aligns with the <strong>Stages of Change</strong> model from Module 9. Counselors listen for both <strong>sustain talk</strong> and <strong>change talk</strong>, recognize that ambivalence is normal, and avoid trying to “fix” the client or persuade them to change.</p><div class="callout"><strong>Key point:</strong> In motivational interviewing, the counselor does not supply the motivation for change. The counselor helps the client discover and strengthen their own reasons for change.</div></div><div class="m10-tabpanel" data-panel="family"><div class="m10-split"><div><p>Family is defined broadly: biological relatives, partners, chosen family, blended or intergenerational families, household members, close friends, adoptive/foster relationships, and others the person identifies as family.</p><p>Problematic substance use can affect communication, roles, finances, safety, boundaries, parenting, trust, stress, and the well-being of the entire family. Family work therefore supports both the person in recovery and family members’ own recovery and self-care.</p><p>Include family with the client’s permission, address confidentiality and safety, identify supportive people, improve communication, discuss warning signs, and develop emergency plans.</p></div><img class="m10-content-img" src="${IMG.monicaHead}" alt="Monica, Derek's sister"></div></div><div class="m10-tabpanel" data-panel="familyapproaches"><div class="m10-four"><div class="m10-card"><strong>MDFT</strong><p>Multidimensional Family Therapy (MDFT) works across the person, family, and community, strengthening coping, communication, emotional regulation, and family functioning.</p></div><div class="m10-card"><strong>CRAFT</strong><p>Community Reinforcement and Family Training (CRAFT) helps family members support positive change through reinforcement, functional analysis, effective communication, and self-care while encouraging treatment engagement without blame, confrontation, or shame.</p></div><div class="m10-card"><strong>Mutual-Support Groups</strong><p>Family-oriented groups can reduce isolation, build coping skills, and connect family members with others facing similar challenges.</p></div><div class="m10-card"><strong>Behavioral Couples Therapy</strong><p>Uses partner support, recovery-focused agreements, communication, caring behaviors, and shared activities to support recovery and relationship functioning.</p></div></div></div><div class="button-row center hidden" id="motivationPractice"><button class="primary-btn" data-action="motivation-practice">Apply Motivational Interviewing →</button></div>`) }
function motivationPractice(){showModal(`<h2>Apply Motivational Interviewing</h2><div class="quote-card quote-with-headshot"><img class="headshot-lower" src="${IMG.derekHead}" alt="Derek"><div><p>Derek says, “Part of me wants to stop drinking, but part of me is scared I won’t know how to relax without it.”</p></div></div><h3>Which response best fits MI?</h3>${choiceMarkup('mi-choice',['“You’re saying alcohol has helped you relax, and you’re also wondering what life could look like without relying on it.”','“Your sister is worried, so you should stop for her.”','“You already know drinking is bad, so you need to decide.”','“Let me explain why your reasons for continuing are incorrect.”'])}`)}

function cbtOpen(){showModal(`<h2>CBT: Understand the Pattern, Then Change the Pattern</h2><p>CBT is a widely used evidence-based approach for problematic substance use. It examines how people interpret internal and external events and how those thoughts, beliefs, feelings, and behaviors influence one another.</p><div class="m10-three"><div class="m10-card"><strong>Thoughts</strong><p>“I can’t handle this stress unless I drink.”</p></div><div class="m10-card"><strong>Feelings</strong><p>Anxiety, frustration, shame, tension, craving</p></div><div class="m10-card"><strong>Behaviors</strong><p>Drink, avoid, call a support, leave a trigger, use a coping skill</p></div></div><div class="m10-split"><img class="m10-content-img" src="${IMG.iceberg}" alt="Iceberg with a small visible portion above water and larger portion below"><div><h3>The Iceberg Analogy</h3><p>Behavior is what we can see above the surface. Underneath may be thoughts, feelings, core beliefs, trauma responses, expectations, and learned associations. Functional analysis helps explore what is below the surface instead of judging the visible behavior alone.</p></div></div><h3>Functional Analysis: ABC</h3><div class="m10-abc"><div><strong>Antecedent</strong><p>What happened before? Where? With whom? What thoughts, feelings, or cues were present?</p></div><div class="arrow">→</div><div><strong>Behavior</strong><p>What did the person do? What thought or urge was connected with the behavior?</p></div><div class="arrow">→</div><div><strong>Consequence</strong><p>What happened next? What short-term relief or reward occurred? What longer-term cost followed?</p></div></div><p>A biopsychosocial assessment supports CBT case conceptualization by examining biological/health factors, psychological factors, and social context, including medical, legal, vocational, housing, and relationship domains.</p><div class="button-row center"><button class="primary-btn" data-action="craving-open">Now Apply This to Craving →</button></div>`)}
function cravingOpen(){showModal(`<h2>Coping With Craving</h2><p>Craving can be disturbing, but TIP 65 emphasizes that it can be understood, anticipated, and managed. Cue conditioning can make people, places, objects, times of day, smells, sounds, sensations, and emotions trigger urges long after a person has stopped using.</p><div class="callout"><strong>Normalize without minimizing:</strong> Cravings are time-limited experiences. TIP 65 notes that many cravings last roughly 7–20 minutes, may rise and fall in intensity, and eventually dissipate.</div><div class="m10-four"><div class="m10-card"><span class="m10-icon" aria-hidden="true">🔎</span><strong>Recognize</strong><p>Identify the cue, internal state, or high-risk situation. Name what is happening instead of treating it as a mystery.</p></div><div class="m10-card"><span class="m10-icon" aria-hidden="true">🚧</span><strong>Avoid</strong><p>Especially early in recovery, reduce exposure to high-risk people, places, objects, and situations when practical.</p></div><div class="m10-card"><span class="m10-icon" aria-hidden="true">🧰</span><strong>Cope</strong><p>Use distraction, change the environment, talk with a safe supportive person, use practiced coping skills, breathe, and allow the urge to pass without acting on it.</p></div><div class="m10-card"><span class="m10-icon" aria-hidden="true">🔁</span><strong>Practice</strong><p>Skills become more available under stress when they are rehearsed between sessions—not introduced for the first time during a crisis.</p></div></div><div class="m10-quote">TIP 65’s structured craving exercise uses three parts: check in about recent cravings and triggers, teach coping skills, then practice the skills and plan between-session use.</div><div class="button-row center"><button class="primary-btn" data-action="craving-apply">Apply It With Derek →</button></div>`) }

function cravingApply(){showModal(`<h2>Apply Craving Management</h2><div class="quote-card quote-with-headshot"><img class="headshot-lower" src="${IMG.derekHead}" alt="Derek"><div><p>Derek drives past the bar after a difficult shift and suddenly experiences an intense urge to drink.</p></div></div><h3>What is the best first interpretation?</h3>${choiceMarkup('craving-choice',['The craving proves that treatment has failed.','The craving means Derek is back in precontemplation.','Derek should ignore the craving because attention will always make it worse.','The cue may have become conditioned to substance use; identifying the trigger can make the experience more understandable and guide coping.'])}`)}

function keyTakeaways(){showModal(`<h2>Module 10: Put It Together</h2><div class="takeaway-grid"><div class="takeaway-card"><span class="takeaway-icon">🧠</span><strong>Addiction Changes Learning & Reward</strong><span>Reward, motivation, memory, cues, and self-control can all be affected. Neuroplasticity also supports recovery.</span></div><div class="takeaway-card"><span class="takeaway-icon">🧭</span><strong>Recovery Has Multiple Pathways</strong><span>Medical, mutual-help, behavioral, strengths-based, harm-reduction, and integrated models can all contribute depending on the person.</span></div><div class="takeaway-card"><span class="takeaway-icon">🤝</span><strong>Relationship Is an Intervention</strong><span>Autonomy, collaboration, trauma-informed care, MI, family support, peers, and nonjudgmental communication influence engagement.</span></div><div class="takeaway-card"><span class="takeaway-icon">🛠️</span><strong>Skills & Systems Matter</strong><span>CBT, functional analysis, craving coping, safety tools, medication access, housing, work, and coordinated systems can all support recovery.</span></div></div><div class="m10-resource"><h3>Optional Resource: SAMHSA TIP 65</h3><p>The relevant concepts from pages 66–108 have been incorporated into this module. You do not need to read the PDF to complete the module. Keep it as a reference if you want more detail, examples, exhibits, and source citations.</p><a class="secondary-btn" href="https://www.ncbi.nlm.nih.gov/books/NBK601482/pdf/Bookshelf_NBK601482.pdf" target="_blank" rel="noopener">Open TIP 65 PDF ↗</a></div><div class="button-row center"><button class="primary-btn" data-action="maria-debrief">Debrief With Maria →</button></div>`)}

async function downloadPDF(){const prompts=[
 ['More Than One Explanation','Think about an everyday behavior or habit from your own life that could be misunderstood if someone saw only the behavior and not what was happening underneath it. What physical, psychological, social, environmental, or situational factors were influencing you?',state.reflections.wholePerson],
 ['What Helps You Change?','Think about a goal you have worked toward. Which kinds of support helped most? What does that suggest about why recovery should be individualized?',state.reflections.pathway],
 ['Autonomy and Positive Change','Think of a time when someone helped you make a difficult decision without taking control of it. What did that person do that made support feel respectful rather than controlling? How could that apply to harm reduction and recovery-oriented counseling?',state.reflections.autonomy],
 ['What Will You Do Differently?','Choose one idea from this module. How could that idea change the way you interpret or respond to a client’s behavior?',state.reflections.support]
];const pageW=1275,pageH=1650,margin=92,contentW=pageW-margin*2;const pages=[];let canvas,ctx,y;const makePage=()=>{canvas=document.createElement('canvas');canvas.width=pageW;canvas.height=pageH;ctx=canvas.getContext('2d');ctx.fillStyle='#faf6ef';ctx.fillRect(0,0,pageW,pageH);ctx.fillStyle='#243746';ctx.fillRect(0,0,pageW,166);ctx.fillStyle='#d7a74a';ctx.fillRect(0,166,pageW,10);ctx.fillStyle='#fff';ctx.font='700 38px Inter, Arial, sans-serif';ctx.fillText('From Addiction to Recovery',margin,76);ctx.font='600 22px Inter, Arial, sans-serif';ctx.fillStyle='#dce9ee';ctx.fillText('Harbor Point · Module 10 Reflection Report',margin,128);y=232;ctx.font='500 19px Inter, Arial, sans-serif';ctx.fillStyle='#354f5c';ctx.fillText(`Completed: ${new Date().toLocaleDateString()} ${new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}`,margin,y);y+=58};const wrap=(text,font,maxWidth)=>{ctx.font=font;const words=(text||'No response recorded.').toString().split(/\s+/);const lines=[];let line='';for(const word of words){const test=line?line+' '+word:word;if(ctx.measureText(test).width>maxWidth&&line){lines.push(line);line=word}else line=test}if(line)lines.push(line);return lines};const add=async()=>{await new Promise(r=>canvas.toBlob(b=>{pages.push(b);r()},'image/jpeg',.9))};makePage();for(const [title,prompt,response] of prompts){const t=wrap(title,'800 25px Inter, Arial, sans-serif',contentW-48),p=wrap(prompt,'700 19px Inter, Arial, sans-serif',contentW-48),r=wrap(response,'500 21px Inter, Arial, sans-serif',contentW-48);const boxH=38+t.length*33+12+p.length*28+18+r.length*31+32;if(y+boxH>pageH-90){await add();makePage()}ctx.fillStyle='#fffdfa';roundRect(ctx,margin,y,contentW,boxH,20,true,false);ctx.strokeStyle='#dfd5c7';ctx.lineWidth=3;roundRect(ctx,margin,y,contentW,boxH,20,false,true);let yy=y+38;ctx.fillStyle='#243746';ctx.font='800 25px Inter, Arial, sans-serif';t.forEach(line=>{ctx.fillText(line,margin+24,yy);yy+=33});yy+=4;ctx.fillStyle='#496173';ctx.font='700 19px Inter, Arial, sans-serif';p.forEach(line=>{ctx.fillText(line,margin+24,yy);yy+=28});yy+=10;ctx.fillStyle='#263238';ctx.font='500 21px Inter, Arial, sans-serif';r.forEach(line=>{ctx.fillText(line,margin+24,yy);yy+=31});y+=boxH+24}await add();const imgs=[];for(const b of pages)imgs.push(new Uint8Array(await b.arrayBuffer()));const bytes=buildPDF(imgs,pageW,pageH);const blob=new Blob([bytes],{type:'application/pdf'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='CDCA_Module10_Reflection.pdf';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);showToast('Your Module 10 PDF has been downloaded.');}
function roundRect(c,x,y,w,h,r,fill,stroke){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();if(fill)c.fill();if(stroke)c.stroke()}
function buildPDF(images,pageW,pageH){const enc=new TextEncoder(),chunks=[],offsets=[0];let length=0;const pt=t=>{const b=enc.encode(t);chunks.push(b);length+=b.length},pb=b=>{chunks.push(b);length+=b.length};pt('%PDF-1.4\n%PDFIMG\n');const objCount=2+images.length*3,pageRefs=[];const obj=(n,w)=>{offsets[n]=length;pt(`${n} 0 obj\n`);w();pt('\nendobj\n')};images.forEach((img,i)=>{const po=3+i*3,co=4+i*3,io=5+i*3;pageRefs.push(`${po} 0 R`);obj(po,()=>pt(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 612 792] /Resources << /XObject << /Im${i+1} ${io} 0 R >> >> /Contents ${co} 0 R >>`));const content=`q\n612 0 0 792 0 0 cm\n/Im${i+1} Do\nQ\n`,cb=enc.encode(content);obj(co,()=>{pt(`<< /Length ${cb.length} >>\nstream\n`);pb(cb);pt('endstream')});obj(io,()=>{pt(`<< /Type /XObject /Subtype /Image /Width ${pageW} /Height ${pageH} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${img.length} >>\nstream\n`);pb(img);pt('\nendstream')})});obj(1,()=>pt('<< /Type /Catalog /Pages 2 0 R >>'));obj(2,()=>pt(`<< /Type /Pages /Kids [${pageRefs.join(' ')}] /Count ${images.length} >>`));const xref=length;pt(`xref\n0 ${objCount+1}\n0000000000 65535 f \n`);for(let i=1;i<=objCount;i++)pt(String(offsets[i]||0).padStart(10,'0')+' 00000 n \n');pt(`trailer\n<< /Size ${objCount+1} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`);const total=chunks.reduce((n,b)=>n+b.length,0),out=new Uint8Array(total);let pos=0;for(const b of chunks){out.set(b,pos);pos+=b.length}return out}

 else if(a==='reflection-1')reflection1(); else if(a==='save-r1'){const t=document.getElementById('rWhole');if(!t.value.trim()){showToast('Please write a response before continuing.');return}state.reflections.wholePerson=t.value.trim();markSection(1);save();showToast('Response saved.');brainScene()}
 else if(a==='brain-open')brainOpen(); else if(a==='brain-adapt')brainAdapt(); else if(a==='brain-behavior')brainBehavior(); else if(a==='brain-choice'){const ok=markChoice(b,3);feedback(b,ok,ok?'Correct':'Take another look',ok?'<p>Craving and unsuccessful efforts to cut down are clinically meaningful, but no single behavior tells the whole story. Assessment looks at the broader pattern, severity, impact on functioning, and the client’s individual circumstances.</p>':'<p>Look for the broader clinical pattern. Craving and difficulty cutting down are relevant to assessment, but neither one alone determines the diagnosis.</p>','recurrence-scene','Continue →')}
